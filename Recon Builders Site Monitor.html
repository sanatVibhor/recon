function milestoneTimeline(list,showP=true){if(!list.length)return emptyState("route","No milestones yet","Milestones added to this site will appear here.");
 const s=list.slice().sort((a,b)=>a.date.localeCompare(b.date)),t=today();let out="",placed=false;
 const todayRow=`<div class="tl-today"><div class="lbl2">Today, ${fmtS(t)}</div><div class="dt"></div><div class="ln"></div></div>`;
 s.forEach(m=>{if(!placed&&m.date>t){out+=todayRow;placed=true}const d=pd(m.date),late=m.status==="Delayed",dd=daysBetween(t,m.date);
  const note=m.status==="Completed"?"Completed":m.status==="In Progress"?(dd>=0?`Due in ${dd} days`:`${-dd} days past target`):late?`${Math.abs(dd)} days ${dd<0?"late":"at risk"}`:`In ${dd} days`;
  out+=`<div class="tl-item s-${m.status.replace(" ","")}"><div class="tl-date"><b>${d.getDate()} ${MON[d.getMonth()]}</b><span>${d.getFullYear()}</span></div><div class="tl-node">${m.status==="Completed"?icon("check"):m.status==="Delayed"?`<span style="color:#fff;font-weight:800;font-size:12px">!</span>`:""}</div>
  <div class="tl-card"><div><h4>${esc(m.title)}</h4><p>${showP?esc(P(m.projectId).name)+", ":""}${esc(PHASES[m.phase])}. ${note}</p></div>${msBadge(m.status)}</div></div>`});
 if(!placed)out+=todayRow;return `<div class="tl">${out}</div>`}
function gantt(){const ps=myProjects();if(!ps.length)return"";
 const s0=Math.min(...ps.map(p=>pd(p.start).getTime())),e0=Math.max(...ps.map(p=>pd(p.end).getTime())),start=new Date(new Date(s0).getFullYear(),new Date(s0).getMonth(),1).getTime(),end=new Date(new Date(e0).getFullYear(),new Date(e0).getMonth()+1,1).getTime(),span=end-start;
 const pct=t=>((t-start)/span*100);let ticks="";const d=new Date(start);while(d.getTime()<end){if(d.getMonth()%3===0)ticks+=`<span class="g-tick" style="left:${pct(d.getTime())}%">${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</span>`;d.setMonth(d.getMonth()+1)}
 const tp=pct(Date.now());
 return `<div class="gantt"><div class="gantt-in"><div class="g-row hd"><div></div><div class="g-track">${ticks}</div></div>${ps.map(p=>{const l=pct(pd(p.start).getTime()),w=pct(pd(p.end).getTime())-l;const cls=p.status==="Delayed"?"late":p.status==="Attention Required"?"att":p.status==="Completed"?"done":"";
  return `<div class="g-row"><a class="g-name" href="#/projects/${p.id}/timeline" style="text-decoration:none">${esc(p.name)}<span>${fmtS(p.start)} ${pd(p.start).getFullYear()} to ${fmtS(p.end)} ${pd(p.end).getFullYear()}</span></a><div class="g-track"><div class="g-bar ${cls}" style="left:${l}%;width:${w}%" data-tip="${p.progress}% complete, ${esc(PHASES[p.phase])}"><i style="width:${p.progress}%"></i></div>${tp>0&&tp<100?`<div class="g-today" style="left:${tp}%"></div>`:""}</div></div>`}).join("")}</div></div>
 <div class="legend" style="margin-top:12px"><span><i style="background:var(--ink)"></i>On track</span><span><i style="background:var(--warn)"></i>Attention required</span><span><i style="background:var(--bad)"></i>Delayed</span><span><i style="background:var(--ok)"></i>Completed</span><span><i style="background:var(--accent);width:3px"></i>Today</span></div>`}
function timelineList(){const f=F.timeline;const pid=f.site||myProjects().find(p=>p.status!=="Completed")?.id||myPids()[0];return milestoneTimeline(DB.milestones.filter(m=>m.projectId===pid),false)}
function viewTimeline(){if(!F.timeline.site)F.timeline.site=myProjects().find(p=>p.status!=="Completed")?.id||myPids()[0]||"";
 return `<div class="page-head"><div><h1>Timeline</h1><p>Planned schedule for every site, and milestones for the one you select.</p></div></div>
 <div class="card" style="margin-bottom:22px"><div class="card-h"><h3>Schedule overview</h3><span class="sub">Bars fill with progress</span></div><div class="card-b">${gantt()}</div></div>
 <div class="chips" style="margin-bottom:18px">${myProjects().map(p=>`<button class="chip ${F.timeline.site===p.id?"on":""}" data-action="setF" data-f="timeline.site" data-v="${p.id}" data-target="tlnlist">${esc(p.name)}</button>`).join("")}</div>
 <div class="card"><div class="card-b" style="padding-top:22px" id="tlnlist">${timelineList()}</div></div>`}
function milestoneTable(ms){const s=ms.slice().sort((a,b)=>a.date.localeCompare(b.date));if(!s.length)return emptyState("flag","No milestones","");
 const st=m=>can("editMilestone")?`<select class="input" style="height:32px;width:auto;font-size:13px" data-ms="${m.id}" aria-label="Status">${["Upcoming","In Progress","Completed","Delayed"].map(x=>`<option ${x===m.status?"selected":""}>${x}</option>`).join("")}</select>`:msBadge(m.status);
 return `<div class="table-wrap cards"><table class="tbl"><thead><tr><th>Milestone</th><th>Phase</th><th>Target date</th><th>Status</th></tr></thead><tbody>${s.map(m=>`<tr style="cursor:default"><td class="t-name">${esc(m.title)}</td><td>${esc(PHASES[m.phase])}</td><td class="num">${fmtD(m.date)}</td><td>${st(m)}</td></tr>`).join("")}</tbody></table></div>
 <div class="mcards">${s.map(m=>`<div class="mcard"><div style="display:flex;justify-content:space-between;gap:10px"><b style="color:var(--ink)">${esc(m.title)}</b></div><div class="faint" style="font-size:12.5px;margin:4px 0 8px">${esc(PHASES[m.phase])}, ${fmtD(m.date)}</div>${st(m)}</div>`).join("")}</div>`}

/* ================= TASKS ================= */
const TST=["To Do","In Progress","Blocked","Completed"],TCOL={"To Do":"var(--text-3)","In Progress":"var(--info)","Blocked":"var(--bad)","Completed":"var(--ok)"};
function dueHTML(t){const late=t.status!=="Completed"&&t.due<today();return `<span class="due ${late?"late":""}">${icon("cal")}${late?"Overdue, ":""}${fmtS(t.due)}</span>`}
function tcard(t){return `<div class="tcard p-${t.priority}" data-action="openTask" data-id="${t.id}" tabindex="0" role="button"><h4>${esc(t.name)}</h4><div class="site">${esc(P(t.projectId).name)}</div>${t.status!=="To Do"?bar(t.progress,t.status==="Completed"?"":"acc"):""}<div class="tf">${dueHTML(t)}<span style="display:flex;gap:6px;align-items:center">${badge(t.priority)}${av(t.assignee,"sm")}</span></div></div>`}
function taskTable(ts){if(!ts.length)return emptyState("tasks","No tasks here","Tasks added for this site will appear here.");
 const s=ts.slice().sort((a,b)=>TST.indexOf(a.status)-TST.indexOf(b.status)||a.due.localeCompare(b.due));
 return `<div class="table-wrap cards"><table class="tbl"><thead><tr><th>Task</th><th>Site</th><th>Assigned to</th><th>Priority</th><th>Due</th><th>Status</th><th style="width:130px">Progress</th></tr></thead><tbody>${s.map(t=>`<tr data-action="openTask" data-id="${t.id}"><td class="t-name">${esc(t.name)}</td><td>${esc(P(t.projectId).name)}</td><td><div class="person">${av(t.assignee,"sm")}<b style="font-weight:500">${esc(U(t.assignee).name)}</b></div></td><td>${badge(t.priority)}</td><td class="num" style="white-space:nowrap">${t.status!=="Completed"&&t.due<today()?`<span style="color:var(--bad);font-weight:600">${fmtS(t.due)}</span>`:fmtS(t.due)}</td><td>${badge(t.status)}</td><td><div style="display:flex;align-items:center;gap:8px">${bar(t.progress,"acc")}<span class="num" style="font-size:12.5px;width:34px">${t.progress}%</span></div></td></tr>`).join("")}</tbody></table></div>
 <div class="mcards">${s.map(tcard).join("")}</div>`}
function taskList(){const f=F.tasks;const ts=DB.tasks.filter(t=>inMine(t)&&(!f.site||t.projectId===f.site)&&(!f.status||t.status===f.status)&&(!f.priority||t.priority===f.priority)&&(!f.assignee||t.assignee===f.assignee));
 if(!ts.length)return emptyState("tasks","No tasks match these filters","Clear the filters to see every task.",`<button class="btn" data-action="clearFilters" data-f="tasks">Clear filters</button>`);
 if(f.view==="list")return taskTable(ts);
 return `<div class="board">${TST.map(s=>{const c=ts.filter(t=>t.status===s).sort((a,b)=>a.due.localeCompare(b.due));return `<div class="col"><div class="col-h"><i style="background:${TCOL[s]}"></i>${s}<span class="c">${c.length}</span></div>${c.map(tcard).join("")||`<p class="faint" style="font-size:12.5px;padding:8px 6px 10px">No tasks</p>`}</div>`}).join("")}</div>`}
function viewTasks(){const ts=DB.tasks.filter(inMine),open=ts.filter(t=>t.status!=="Completed");
 return `<div class="page-head"><div><h1>Tasks</h1><p>${open.length} open task${open.length===1?"":"s"} across your sites, ${open.filter(t=>t.due<today()).length} overdue.</p></div><div class="head-actions">${can("createTask")?`<button class="btn btn-primary" data-action="addTask">${icon("plus")}Add task</button>`:""}</div></div>
 <div class="filters">${sel("tasks.site","tlist",myProjects().map(p=>[p.id,p.name]),"All sites")}${sel("tasks.status","tlist",TST,"All statuses")}${sel("tasks.priority","tlist",["High","Medium","Low"],"All priorities")}${sel("tasks.assignee","tlist",team().filter(u=>ts.some(t=>t.assignee===u.id)).map(u=>[u.id,u.name]),"Anyone")}
 <div class="seg" style="margin-left:auto" role="group" aria-label="View"><button class="${F.tasks.view==="board"?"on":""}" data-action="setF" data-f="tasks.view" data-v="board" data-target="tlist" data-rerender="1">${icon("board")}Board</button><button class="${F.tasks.view==="list"?"on":""}" data-action="setF" data-f="tasks.view" data-v="list" data-target="tlist" data-rerender="1">${icon("list")}List</button></div></div>
 <div id="tlist">${taskList()}</div>`}

/* ================= ISSUES ================= */
function issueCards(list){if(!list.length)return emptyState("check","No issues here","Nothing reported for this selection.");
 const ord={"Open":0,"In Review":1,"Resolved":2},pr={High:0,Medium:1,Low:2};
 return list.slice().sort((a,b)=>ord[a.status]-ord[b.status]||pr[a.priority]-pr[b.priority]||b.date.localeCompare(a.date)).map(i=>{const hi=i.priority==="High"&&i.status!=="Resolved";
  return `<article class="issue ${hi?"hi":""} ${i.status==="Resolved"?"resolved":""}" data-action="openIssue" data-id="${i.id}" tabindex="0" role="button"><div style="min-width:0"><h4>${hi?`<span class="hi-flag">${icon("alert")}High priority</span>`:""}${esc(i.title)}</h4><p>${esc(i.desc)}</p>
  <div class="meta"><span>${icon("building")}${esc(P(i.projectId).name)}</span><span>${icon("user")}Reported by ${esc(U(i.reportedBy).name)}</span><span>${icon("cal")}${fmtD(i.date)}</span><span>${icon("worker")}Assigned to ${esc(U(i.assignee).name)}</span></div></div>
  <div class="side-r">${badge(i.status)}${i.priority!=="High"||i.status==="Resolved"?badge(i.priority,"nodot"):""}</div></article>`}).join("")}
function issueList(){const f=F.issues;return issueCards(DB.issues.filter(i=>inMine(i)&&(!f.site||i.projectId===f.site)&&(!f.status||i.status===f.status)&&(!f.priority||i.priority===f.priority)))}
function viewIssues(){const is=DB.issues.filter(inMine),c=s=>is.filter(i=>i.status===s).length,hi=is.filter(i=>i.priority==="High"&&i.status!=="Resolved").length;
 return `<div class="page-head"><div><h1>Issues and observations</h1><p>Problems raised from site, who owns them and where they stand.</p></div><div class="head-actions">${can("reportIssue")?`<button class="btn btn-primary" data-action="addIssue">${icon("alert")}Report issue</button>`:""}</div></div>
 <div class="istat"><div class="hot"><b class="num">${hi}</b><span>High priority, unresolved</span></div><div><b class="num">${c("Open")}</b><span>Open</span></div><div><b class="num">${c("In Review")}</b><span>In review</span></div><div><b class="num">${c("Resolved")}</b><span>Resolved</span></div></div>
 <div class="filters">${sel("issues.site","ilist",myProjects().map(p=>[p.id,p.name]),"All sites")}${sel("issues.status","ilist",["Open","In Review","Resolved"],"All statuses")}${sel("issues.priority","ilist",["High","Medium","Low"],"All priorities")}</div>
 <div id="ilist">${issueList()}</div>`}
/* ================= GALLERY ================= */
let LB=[];
function galleryGroups(list,group){if(!list.length)return emptyState("image","No photos yet","Photos added from site will appear here.",can("addPhoto")?`<button class="btn btn-primary" data-action="addPhoto">Add photos</button>`:"");
 const s=list.slice().sort((a,b)=>b.date.localeCompare(a.date));LB=s.map(p=>p.id);
 const key=group==="phase"?p=>p.phase:group==="site"?p=>p.projectId:p=>p.date;
 const keys=[...new Set(s.map(key))];if(group==="phase")keys.sort((a,b)=>b-a);
 return keys.map(k=>{const items=s.filter(p=>key(p)===k),label=group==="phase"?PHASES[k]:group==="site"?P(k).name:dayLabel(k);
  return `<div class="group-h">${esc(label)}<span class="c">${items.length} photo${items.length===1?"":"s"}</span></div><div class="masonry" style="margin-bottom:20px">${items.map(p=>`<button class="ph" data-action="openPhoto" data-id="${p.id}"><img src="${photoSrc(p)}" alt="${esc(p.desc)}" loading="lazy"><div class="cap"><b>${esc(p.desc)}</b><span>${group!=="site"?esc(P(p.projectId).name)+", ":""}${group!=="phase"?esc(PHASES[p.phase]):fmtS(p.date)}</span></div></button>`).join("")}</div>`}).join("")}
function galleryList(){const f=F.gallery;return galleryGroups(DB.photos.filter(p=>inMine(p)&&(!f.site||p.projectId===f.site)&&(f.phase===""||p.phase===+f.phase)),f.group)}
function viewGallery(){const n=DB.photos.filter(inMine).length;
 return `<div class="page-head"><div><h1>Site gallery</h1><p>${n} photos from your sites. Tap any photo to see where and when it was taken.</p></div><div class="head-actions">${can("addPhoto")?`<button class="btn btn-primary" data-action="addPhoto">${icon("camera")}Add photos</button>`:""}</div></div>
 <div class="filters">${sel("gallery.site","glist",myProjects().map(p=>[p.id,p.name]),"All sites")}${sel("gallery.phase","glist",PHASES.map((p,i)=>[i,p]),"All phases")}
 <div class="seg" style="margin-left:auto" role="group" aria-label="Group photos by"><span style="font-size:12.5px;color:var(--text-3);padding:0 6px 0 8px;align-self:center">Group by</span>${[["date","Date"],["phase","Phase"],["site","Site"]].map(g=>`<button class="${F.gallery.group===g[0]?"on":""}" data-action="setF" data-f="gallery.group" data-v="${g[0]}" data-target="glist">${g[1]}</button>`).join("")}</div></div>
 <div id="glist">${galleryList()}</div>`}

/* ================= DOCUMENTS ================= */
const DCATS=["Architectural drawings","Structural drawings","Approvals","Contracts","Bills","Site reports","Safety documents","Other"];
function ficon(ext){const k=["pdf","dwg","xlsx","docx","jpg","png"].includes(ext)?ext:"other";return `<span class="ficon ${k}">${esc(ext.toUpperCase().slice(0,4))}</span>`}
function docTable(docs){if(!docs.length)return emptyState("file","No documents here","Try another category or upload a file.");
 const s=docs.slice().sort((a,b)=>b.date.localeCompare(a.date)),adm=ME.role==="admin";
 const acts=d=>`<div style="display:flex;gap:4px;justify-content:flex-end"><button class="icon-btn" data-tip="Download" data-action="download" data-id="${d.id}" style="width:34px;height:34px">${icon("download")}</button></div>`;
 return `<div class="table-wrap cards"><table class="tbl"><thead><tr><th>Name</th><th>Project</th><th>Uploaded by</th><th>Date</th><th>Size</th>${adm?"<th>Visibility</th>":""}<th></th></tr></thead><tbody>${s.map(d=>`<tr style="cursor:default"><td><div class="doc-name">${ficon(d.ext)}<div style="min-width:0"><b title="${esc(d.name)}">${esc(d.name)}</b><span>${esc(d.category)}</span></div></div></td><td style="white-space:nowrap">${esc(P(d.projectId).name)}</td><td style="white-space:nowrap">${esc(U(d.by).name)}</td><td class="num" style="white-space:nowrap">${fmtD(d.date)}</td><td class="num">${esc(d.size)}</td>${adm?`<td>${d.approved?'<span class="badge b-ok">Client visible</span>':'<span class="badge">Internal</span>'}</td>`:""}<td>${acts(d)}</td></tr>`).join("")}</tbody></table></div>
 <div class="mcards">${s.map(d=>`<div class="mcard"><div class="doc-name">${ficon(d.ext)}<div style="min-width:0;flex:1"><b style="white-space:normal">${esc(d.name)}</b><span>${esc(P(d.projectId).name)}, ${fmtS(d.date)}, ${esc(d.size)}</span></div>${acts(d)}</div></div>`).join("")}</div>`}
function docList(){const f=F.docs;return docTable(visibleDocs().filter(d=>(!f.cat||d.category===f.cat)&&(!f.site||d.projectId===f.site)&&(!f.q||d.name.toLowerCase().includes(f.q.toLowerCase()))))}
function viewDocuments(){const ds=visibleDocs();
 return `<div class="page-head"><div><h1>Documents</h1><p>${ME.role==="client"?"Approved drawings, approvals and reports for your project.":"Drawings, approvals, contracts and site records for every project."}</p></div><div class="head-actions">${can("uploadDocs")?`<button class="btn btn-primary" data-action="addDoc">${icon("upload")}Upload document</button>`:""}</div></div>
 <div class="docs-layout"><div class="cat-list" role="group" aria-label="Categories"><button class="${!F.docs.cat?"on":""}" data-action="setF" data-f="docs.cat" data-v="" data-target="dlist">All documents<span class="c">${ds.length}</span></button>${DCATS.map(c=>`<button class="${F.docs.cat===c?"on":""}" data-action="setF" data-f="docs.cat" data-v="${c}" data-target="dlist">${c}<span class="c">${ds.filter(d=>d.category===c).length}</span></button>`).join("")}</div>
 <div style="min-width:0"><div class="filters"><input class="input grow" type="search" placeholder="Search file names" data-f="docs.q" data-target="dlist" value="${esc(F.docs.q)}" aria-label="Search documents">${sel("docs.site","dlist",myProjects().map(p=>[p.id,p.name]),"All projects")}</div><div id="dlist">${docList()}</div></div></div>`}

/* ================= REPORTS ================= */
function reportBody(){const pid=F.reports.site,ps=pid?[P(pid)]:DB.projects,pids=ps.map(p=>p.id),act=ps.filter(p=>p.status!=="Completed");
 const ts=DB.tasks.filter(t=>pids.includes(t.projectId)),is=DB.issues.filter(i=>pids.includes(i.projectId));
 const comp=pid?ps[0].progress:Math.round(act.reduce((a,p)=>a+p.progress,0)/(act.length||1));
 const ms=DB.milestones.filter(m=>pids.includes(m.projectId)&&m.status!=="Completed").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
 const series=(pid?ps:act).map((p,i)=>({name:p.name,color:PAL[i%PAL.length],values:p.history}));
 const groups=pid?team().filter(u=>ts.some(t=>t.assignee===u.id)).map(u=>({l:u.name.split(" ")[0],a:ts.filter(t=>t.assignee===u.id&&t.status==="Completed").length,b:ts.filter(t=>t.assignee===u.id&&t.status!=="Completed").length}))
  :DB.projects.map(p=>({l:p.name.replace("Recon ",""),a:DB.tasks.filter(t=>t.projectId===p.id&&t.status==="Completed").length,b:DB.tasks.filter(t=>t.projectId===p.id&&t.status!=="Completed").length}));
 const done=ts.filter(t=>t.status==="Completed").length;
 const k=(l,v,s)=>`<div class="kpi"><div class="k-l">${l}</div><div class="k-v num">${v}</div><div class="k-s">${s}</div></div>`;
 return `<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">${k(pid?"Completion":"Average completion",comp+"<small>%</small>",pid?PHASES[ps[0].phase]:`${act.length} active sites`)}${k("Tasks completed",done,`${ts.length-done} pending`)}${k("Open issues",is.filter(i=>i.status!=="Resolved").length,`${is.filter(i=>i.status==="Resolved").length} resolved`)}${k("Daily updates, 7 days",DB.updates.filter(u=>pids.includes(u.projectId)&&daysBetween(u.date,today())<7).length,"submitted from site")}</div>
 <div class="grid g-main" style="margin-top:18px"><div class="card chart-card"><div class="card-h"><h3>Progress over time</h3><span class="sub">Monthly completion</span></div><div class="card-b">${lineChart(monthLabels(8),series,{h:240})}</div></div>
 <div class="card"><div class="card-h"><h3>Project completion</h3></div><div class="card-b" style="display:grid;place-items:center;gap:12px;padding:22px"><div class="ring-wrap">${ring(comp,168,14)}<div class="rl"><b class="num" style="font-size:38px">${comp}%</b><span>${pid?"complete":"average"}</span></div></div><p class="muted" style="text-align:center;font-size:13.5px;max-width:260px">${pid?`${esc(ps[0].name)} is in ${esc(PHASES[ps[0].phase].toLowerCase())}, due ${fmtMY(ps[0].end)}.`:"Across all sites still under construction."}</p></div></div></div>
 <div class="grid g3" style="margin-top:18px"><div class="card"><div class="card-h"><h3>Site-wise progress</h3></div><div class="card-b">${hbars(DB.projects.map(p=>({l:p.name.replace("Recon ",""),v:p.progress,acc:p.id===pid})))}</div></div>
 <div class="card"><div class="card-h"><h3>Tasks completed vs pending</h3><span class="sub">${pid?"By person":"By site"}</span></div><div class="card-b">${groups.length?vbars(groups,[{k:"a",l:"Completed",c:"var(--ok)"},{k:"b",l:"Pending",c:"var(--accent)"}]):`<p class="muted">No tasks yet.</p>`}</div></div>
 <div class="card"><div class="card-h"><h3>Issues by status</h3></div><div class="card-b">${donut([{l:"Open",v:is.filter(i=>i.status==="Open").length,c:"var(--bad)"},{l:"In review",v:is.filter(i=>i.status==="In Review").length,c:"var(--warn)"},{l:"Resolved",v:is.filter(i=>i.status==="Resolved").length,c:"var(--ok)"}],140,18)}</div></div></div>
 <div class="card" style="margin-top:18px"><div class="card-h"><h3>Open milestones</h3><span class="sub">Earliest first</span></div><div class="card-b">${ms.map(m=>{const d=pd(m.date);return `<div class="ms-row"><div class="ms-date"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div><div style="flex:1;min-width:0"><div class="t">${esc(m.title)}</div><div class="s">${esc(P(m.projectId).name)}, ${esc(PHASES[m.phase])}</div></div>${msBadge(m.status)}</div>`}).join("")||`<p class="muted">No upcoming milestones.</p>`}</div></div>`}
function viewReports(){return `<div class="page-head"><div><h1>Reports and analytics</h1><p>Progress, tasks and issues for the whole portfolio or a single site.</p></div><div class="head-actions">${sel("reports.site","rlist",DB.projects.map(p=>[p.id,p.name]),"All sites").replace('class="input"','class="input" style="height:38px;width:auto"')}<button class="btn btn-primary" data-action="exportReport">${icon("download")}Export report</button></div></div><div id="rlist">${reportBody()}</div>`}

/* ================= TEAM ================= */
function viewTeam(){const staff=DB.users.filter(u=>u.role!=="client"),clients=DB.users.filter(u=>u.role==="client");
 const card=u=>`<div class="tm"><div class="tm-h">${av(u,"lg")}<div style="min-width:0"><b>${esc(u.name)}</b><span>${esc(u.title)}</span></div></div>

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const m=900,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};img.src=fr.result};fr.readAsDataURL(file)})}

  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();SIDX=(SIDX+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle("act",i===SIDX));items[SIDX].scrollIntoView({block:"nearest"})}
  if(e.key==="Enter"){e.preventDefault();pickResult(items[SIDX]||items[0])}}
 if(e.key==="Enter"&&e.target.matches("[role=button][data-action]")){e.preventDefault();e.target.click()}});
window.addEventListener("hashchange",()=>{if(ME){closeModal();route()}});

 let s=null;try{s=JSON.parse(store.get(SES_KEY)||store.get(SES_KEY,true)||"null")}catch(e){}
 const u=s&&DB.users.find(x=>x.id===s.id);if(u)startApp(u,false);else renderAuth("login")})();
</script>
